<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Espejo de Venus — Eymi Samara</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Cinzel:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0c0305;
    --guinda: #6b1220;
    --guinda-mid: #8a1a2a;
    --guinda-light: #a82235;
    --cream: #f0e6de;
    --gold-dark: #8c5e32; /* Tono dorado más oscuro para contraste */
    --charcoal: #1a0d10;  /* Negro elegante para máxima legibilidad */
    --muted-dark: #4a3538;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    background: var(--ink);
    font-family: 'Cormorant Garamond', Georgia, serif;
    color: var(--charcoal);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    background-image: radial-gradient(ellipse 70% 60% at 50% 50%, rgba(107,18,32,0.2) 0%, transparent 100%);
  }

  /* Textura de grano clásica */
  body::after {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23g)' opacity='0.025'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 999;
  }

  /* Contenedor Principal del Espejo - Centrado absoluto en móviles */
  .mirror-frame {
    position: relative;
    width: clamp(290px, 85vw, 440px);
    height: clamp(520px, 78vh, 680px);
    background: rgba(12, 3, 5, 0.6);
    border-radius: 200px 200px 30px 30px; 
    padding: 16px;
    box-shadow: 
      0 0 0 1px rgba(212, 168, 112, 0.2),
      0 30px 100px rgba(0, 0, 0, 0.8),
      inset 0 0 40px rgba(107, 18, 32, 0.3);
    border: 2px solid rgba(212, 168, 112, 0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    animation: fadeIn 2.5s ease;
    margin: auto; /* Asegura el centrado en flexbox móvil */
  }

  /* El lienzo que contiene el Video Secreto */
  .mirror-canvas {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 185px 185px 20px 20px;
    overflow: hidden;
    background: #000;
  }

  .mirror-canvas video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.85;
    transition: opacity 1s ease;
  }

  /* El Velo de Cristal (Glassmorphism) - Ajustado para legibilidad clara */
  .glass-veil {
    position: absolute;
    inset: 0;
    background: rgba(240, 230, 222, 0.85); /* Fondo claro opaco para contrastar con el cabello */
    backdrop-filter: blur(30px) saturate(100%);
    -webkit-backdrop-filter: blur(30px) saturate(100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px;
    transition: all 1.2s cubic-bezier(0.25, 1, 0.5, 1);
    z-index: 10;
    pointer-events: auto;
  }

  /* Contenido sobre el velo - Letras Negras */
  .veil-content {
    transition: opacity 0.8s ease;
    max-width: 280px;
  }

  .veil-label {
    font-family: 'Cinzel', serif;
    font-size: 9px;
    letter-spacing: 6px;
    color: var(--gold-dark);
    text-transform: uppercase;
    margin-bottom: 24px;
    font-weight: 500;
  }

  .veil-title {
    font-family: 'Cinzel', serif;
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 3px;
    line-height: 1.5;
    color: var(--charcoal);
    margin-bottom: 30px;
  }

  .veil-instruction {
    font-size: 16px;
    font-style: italic;
    color: var(--muted-dark);
    line-height: 1.8;
    font-weight: 400;
  }

  /* Efecto de Desvanecimiento al interactuar */
  .mirror-frame:hover .glass-veil,
  .mirror-frame:active .glass-veil {
    backdrop-filter: blur(0px) saturate(100%);
    -webkit-backdrop-filter: blur(0px) saturate(100%);
    background: rgba(0, 0, 0, 0.2);
  }

  .mirror-frame:hover .veil-content,
  .mirror-frame:active .veil-content {
    opacity: 0;
    pointer-events: none;
  }

  .mirror-frame:hover video,
  .mirror-frame:active video {
    opacity: 1;
  }

  /* Adorno clásico debajo del marco */
  .gold-line {
    width: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-dark), transparent);
    margin: 20px auto 0;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="mirror-frame">
  <div class="mirror-canvas">
    
    <video autoplay loop muted playsinline>
      <source src="tu_video_de_samara.mp4" type="video/mp4">
      Tu navegador no soporta videos en HTML.
    </video>

    <div class="glass-veil">
      <div class="veil-content">
        <p class="veil-label">El Espejo de Venus</p>
        <h2 class="veil-title">EYMI SAMARA</h2>
        <div class="gold-line"></div>
        <br>
        <p class="veil-instruction">
          Acaricia el cristal para disipar el tiempo<br>
          y descubrir el contorno sagrado<br>
          de mi única certeza.
        </p>
      </div>
    </div>

  </div>
</div>

</body>
</html>
