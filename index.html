<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>El Espejo de Venus — Eymi Samara</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Cinzel:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0c0305;
    --guinda: #6b1220;
    --gold-dark: #61401b; /* Dorado profundo para máximo contraste */
  }

  * { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
    -webkit-tap-highlight-color: transparent;
  }
  
  /* Contenedor dinámico para asegurar centrado perfecto en móviles */
  body {
    background: var(--ink);
    font-family: 'Cormorant Garamond', Georgia, serif;
    width: 100vw;
    height: 100dvh; /* Altura dinámica que se adapta al navegador móvil */
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    background-image: radial-gradient(ellipse 70% 60% at 50% 50%, rgba(107,18,32,0.25) 0%, transparent 100%);
  }

  /* Textura de grano clásica */
  body::after {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23g)' opacity='0.025'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 999;
  }

  /* Estructura del Espejo - Proporciones cuidadas y centradas */
  .mirror-frame {
    position: relative;
    width: clamp(290px, 86vw, 420px);
    height: clamp(500px, 76vh, 640px);
    background: rgba(12, 3, 5, 0.8);
    border-radius: 210px 210px 40px 40px; /* Arco clásico */
    padding: 14px;
    box-shadow: 
      0 0 0 1px rgba(212, 168, 112, 0.25),
      0 25px 70px rgba(0, 0, 0, 0.9),
      inset 0 0 30px rgba(107, 18, 32, 0.4);
    border: 2px solid rgba(212, 168, 112, 0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    animation: fadeIn 2s ease-out;
  }

  /* Lienzo del Video */
  .mirror-canvas {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 195px 195px 26px 26px;
    overflow: hidden;
    background: #000;
  }

  .mirror-canvas video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.1; /* Oculto casi por completo bajo el velo */
    transition: opacity 1.2s cubic-bezier(0.25, 1, 0.5, 1);
  }

  /* El Velo de Cristal - Máxima opacidad clara para anular el fondo del video */
  .glass-veil {
    position: absolute;
    inset: 0;
    background: rgba(255, 255, 255, 0.88); /* Fondo blanco liso que bloquea el cabello */
    backdrop-filter: blur(35px) saturate(100%);
    -webkit-backdrop-filter: blur(35px) saturate(100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 36px;
    transition: all 1.2s cubic-bezier(0.25, 1, 0.5, 1);
    z-index: 10;
  }

  /* Letras estrictamente Negras y legibles */
  .veil-content {
    transition: opacity 0.8s ease;
    max-width: 260px;
  }

  .veil-label {
    font-family: 'Cinzel', serif;
    font-size: 9px;
    letter-spacing: 6px;
    color: var(--gold-dark); /* Dorado oscuro contrastante */
    text-transform: uppercase;
    margin-bottom: 20px;
    font-weight: 500;
  }

  .veil-title {
    font-family: 'Cinzel', serif;
    font-size: 24px;
    font-weight: 500;
    letter-spacing: 4px;
    line-height: 1.4;
    color: #000000; /* Negro puro */
    margin-bottom: 24px;
  }

  .veil-instruction {
    font-size: 17px;
    font-style: italic;
    color: #000000; /* Negro puro */
    line-height: 1.8;
    font-weight: 400;
  }

  /* Línea divisoria en el velo */
  .gold-line {
    width: 50px;
    height: 1px;
    background: var(--gold-dark);
    margin: 16px auto 0;
    opacity: 0.5;
  }

  /* Interacción interactiva (Mouse y Táctil) */
  .mirror-frame:hover .glass-veil,
  .mirror-frame:active .glass-veil {
    backdrop-filter: blur(0px) saturate(100%);
    -webkit-backdrop-filter: blur(0px) saturate(100%);
    background: rgba(0, 0, 0, 0.1);
    opacity: 0;
    pointer-events: none;
  }

  .mirror-frame:hover video,
  .mirror-frame:active video {
    opacity: 1; /* El video se revela al 100% de nitidez */
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.96); }
    to { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>

<div class="mirror-frame">
  <div class="mirror-canvas">
    
    <video autoplay loop muted playsinline>
      <source src="amor.mp4" type="video/mp4">
      Tu navegador no soporta videos en HTML.
    </video>

    <div class="glass-veil">
      <div class="veil-content">
        <p class="veil-label">El Espejo de Venus</p>
        <h2 class="veil-title">EYMI SAMARA</h2>
        <div class="gold-line"></div>
        <br>
        <p class="veil-instruction">
          Acaricia el cristal para disipar el tiempo<br>
          y descubrir el contorno sagrado<br>
          de mi única certeza.
        </p>
      </div>
    </div>

  </div>
</div>

</body>
</html>
